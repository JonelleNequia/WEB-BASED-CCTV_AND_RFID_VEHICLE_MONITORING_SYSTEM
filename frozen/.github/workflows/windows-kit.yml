# Reusable Windows leg of the manually dispatched offline-packages.yml workflow.
# No push trigger and no GitHub Release publication.
name: Windows offline candidate (manual workflow leg)
on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      version:
        required: true
        type: string
      build_identity:
        required: true
        type: string
permissions:
  contents: read
jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: fileinfo, intl, zip, sqlite3, pdo_sqlite
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
      - name: Assert selected committed source
        shell: pwsh
        env:
          SELECTED_COMMIT: ${{ inputs.source_commit }}
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Native x64 Windows builder required' }
          if ((git rev-parse HEAD).Trim() -ne $env:SELECTED_COMMIT -or (git status --porcelain)) { throw 'Dirty or wrong source checkout refused' }
      - name: Inno Setup (build machine only)
        shell: pwsh
        run: |
          $pin=(Get-Content build/windows/build-tools.json -Raw | ConvertFrom-Json).innosetup
          $installer=Join-Path $env:RUNNER_TEMP 'verified-inno.exe'
          Invoke-WebRequest -Uri $pin.url -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'Build compiler hash mismatch' }
          $signature=Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch [regex]::Escape($pin.publisher_subject)) { throw 'Build compiler publisher verification failed' }
          $compilerRoot=Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $process=Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$compilerRoot" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Build compiler setup failed' }
          "PHILCST_INNO=$compilerRoot\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build complete unsigned acceptance candidate
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.source_commit }}
          BUILD_ID: ${{ inputs.build_identity }}
        run: ./build/windows/build-release.ps1 -Version $env:VERSION -SourceCommit $env:COMMIT -BuildIdentity $env:BUILD_ID -DevelopmentSnapshot -Python python -Installer -Iscc $env:PHILCST_INNO
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PHILCST-win64-${{ inputs.build_identity }}-NOT-RELEASE
          path: |
            build/windows/dist/*.zip
            build/windows/dist/*.exe
            build/windows/dist/*.sha256
            build/windows/dist/*.update.json
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UPDATE-METADATA-windows-x64-${{ inputs.build_identity }}
          path: build/windows/dist/*.update.json
          if-no-files-found: error
          retention-days: 14
      - name: Guarded hosted-runner smoke test (not clean offline/reboot acceptance)
        shell: pwsh
        timeout-minutes: 45
        run: ./build/windows/ci/install-check.ps1 -Setup (Get-ChildItem build/windows/dist/PHILCST-VMS-Setup-*.exe | Select-Object -First 1).FullName -ConfirmIsolatedRunner
